name: "1. Selenium Web E2E Testing"

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  selenium-e2e:
    name: Execute Live Selenium E2E Automation Suite (470 Test Cases)
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: https://prudhviraj2006.github.io/smart-sales-forecaster/

    env:
      BASE_URL: https://prudhviraj2006.github.io/smart-sales-forecaster/
      HEADLESS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Chrome Browser for Selenium
        uses: browser-actions/setup-chrome@v1
        continue-on-error: true

      - name: Install Python Automation Packages
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest selenium Pillow

      - name: Build Web Application
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          keep_files: false

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./frontend/dist

      - name: Deploy to Direct GitHub Pages Site
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Display & Output Live Deployment Links
        run: |
          echo "# 🚀 Live Deployment & Reports Summary" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Production Application" >> $GITHUB_STEP_SUMMARY
          echo "[https://prudhviraj2006.github.io/smart-sales-forecaster/](https://prudhviraj2006.github.io/smart-sales-forecaster/)" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 HTML Execution Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "[https://prudhviraj2006.github.io/smart-sales-forecaster/reports/latest/execution-report.html](https://prudhviraj2006.github.io/smart-sales-forecaster/reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY

      - name: Run Live Selenium E2E Tests (470 Test Cases)
        continue-on-error: true
        run: |
          python automation/runners/run_selenium_tests.py

      - name: Upload Execution Evidence and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-e2e-results
          path: Test Results
          retention-days: 30

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
