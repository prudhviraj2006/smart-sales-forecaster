name: "4. Backend Vulnerability & API Testing"

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Execute Backend Security Audit & SAST/DAST (410+ Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest fastapi uvicorn

      - name: Build Excel Vulnerability Reports
        run: |
          python build_excel_reports.py

      - name: Upload Vulnerability Audit Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-vulnerability-results
          path: "Vulnerability Test Results"
          retention-days: 30
