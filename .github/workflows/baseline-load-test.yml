name: Baseline API Load & Performance Testing

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    name: Execute Baseline Load Testing (100 Concurrent VUs for 1 Minute)
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://prudhviraj2006.github.io/smart-sales-forecaster/
      VIRTUAL_USERS: "100"
      LOAD_TEST_DURATION: "15"

    steps:
      - name: Stage 1: Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Load Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Stage 3: Run Baseline Load Test (100 VUs)
        run: |
          python automation/runners/run_load_test.py

      - name: Stage 4: Upload Load Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-load-test-results
          path: Test Results
          retention-days: 30

      - name: Stage 5: Publish Load Test Response Time & RPS Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/load_test_summary.md" ]; then
            cat "Test Results/Summary/load_test_summary.md" >> $GITHUB_STEP_SUMMARY
          fi
