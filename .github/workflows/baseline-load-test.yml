name: 4. Baseline API Load Testing (100 VUs / 1 Minute)

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  baseline-load-test:
    name: Continuous Baseline Load Test (100 Concurrent VUs / 1 Minute)
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://prudhviraj2006.github.io/smart-sales-forecaster/

    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Load Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Stage 3: Execute Continuous 1-Minute Load Test (100 VUs)
        run: |
          python automation/runners/run_load_test.py

      - name: Stage 4: Upload Load Testing Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-load-test-results-build-${{ github.run_number }}
          path: |
            Test Results/Summary/load_test_summary.md
            Test Results/JSON/load_test_results.json
          retention-days: 30

      - name: Stage 5: Render RPS & Response Time Metrics into GitHub Actions Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/load_test_summary.md" ]; then
            cat "Test Results/Summary/load_test_summary.md" >> $GITHUB_STEP_SUMMARY
          fi
