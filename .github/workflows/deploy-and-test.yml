name: 3. Live GitHub Pages Deployment & Selenium E2E Automation

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-and-test:
    name: Build, Deploy to Live GitHub Pages & Execute 400+ Selenium E2E Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://prudhviraj2006.github.io/smart-sales-forecaster/
      HEADLESS: "true"

    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage 2: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'automation/requirements.txt'

      - name: Setup Chrome Browser for Selenium
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install Python & Selenium Automation Packages
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest selenium Pillow

      - name: Stage 3: Build Web Application
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Stage 4: Deploy Production Dist to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          keep_files: false

      - name: Stage 5: Wait for GitHub Pages Propagation
        run: |
          echo "Waiting 10 seconds for live deployment to propagate..."
          sleep 10

      - name: Stage 6: Verify Live Deployment Endpoint
        run: |
          echo "Verifying HTTP response for live URL: ${{ env.BASE_URL }}"
          curl -s -o /dev/null -w "%{http_code}" ${{ env.BASE_URL }} || echo "Live site ping complete"

      - name: Stage 7: Run Live Selenium E2E Tests against GitHub Pages
        run: |
          python automation/runners/run_selenium_tests.py

      - name: Stage 8: Upload All Execution Evidence & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-selenium-e2e-results-build-${{ github.run_number }}
          path: |
            Test Results/
            reports/
          retention-days: 30

      - name: Stage 9: Publish Live Execution Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
