name: Automated Security Audit & Vulnerability Scanner

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Framework Detection, SAST, DAST & Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Audit & Reporting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest semgrep

      - name: Run Semgrep Static Application Security Testing (SAST)
        run: |
          semgrep scan --config p/ci . || echo "Semgrep completed with warnings"

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-results.txt'

      - name: Execute Automated Backend Test Suite
        run: |
          python automation/generate_excel_audit.py

      - name: Upload Security & Performance Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vulnerability-Test-Results
          path: |
            Vulnerability Test Results/
            trivy-results.txt
          retention-days: 30

      - name: Publish Security Audit Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f "Vulnerability Test Results/executive-summary.md" ]; then
            cat "Vulnerability Test Results/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          fi
