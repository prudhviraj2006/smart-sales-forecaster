name: Live GitHub Pages Deployment & Selenium E2E Automation

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-test:
    name: Build, Deploy to Live GitHub Pages & Execute 400+ Selenium E2E Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://prudhviraj2006.github.io/smart-sales-forecaster/
      HEADLESS: "true"

    steps:
      - name: Stage 1: Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Chrome Browser for Selenium
        uses: browser-actions/setup-chrome@v3

      - name: Install Python & Selenium Automation Packages
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest selenium Pillow

      - name: Stage 3: Build Web Application
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Stage 4: Deploy Production Dist to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          keep_files: false

      - name: Stage 5: Run Live Selenium E2E Tests against GitHub Pages
        run: |
          python automation/runners/run_selenium_tests.py

      - name: Stage 6: Upload Execution Evidence & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-selenium-e2e-results
          path: Test Results
          retention-days: 30

      - name: Stage 7: Publish Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
