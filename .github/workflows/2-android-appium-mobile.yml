name: "2. Android Appium Mobile E2E Testing"

on:
  workflow_dispatch:

jobs:
  android-appium:
    name: Execute Android Appium E2E Automation Suite (510 Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest Appium-Python-Client

      - name: Execute Android Appium Test Suite (510 Test Cases)
        continue-on-error: true
        run: |
          python automation/runners/run_appium_tests.py

      - name: Upload Execution Evidence and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-e2e-results
          path: Test Results
          retention-days: 30
