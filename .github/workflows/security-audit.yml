name: 2. Backend Security Audit & SAST/DAST Vulnerability Scanner

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Execute SAST/DAST Security Audit & Code Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl jinja2

      - name: Stage 3: Run Backend Security Vulnerability Scanner
        run: |
          python automation/runners/run_security_audit.py

      - name: Stage 4: Upload Security Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report-build-${{ github.run_number }}
          path: Test Results/Summary/security_audit_summary.md
          retention-days: 30

      - name: Stage 5: Render Security Audit Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/security_audit_summary.md" ]; then
            cat "Test Results/Summary/security_audit_summary.md" >> $GITHUB_STEP_SUMMARY
          fi
