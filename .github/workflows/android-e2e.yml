name: 1. Android Appium E2E Automation & GitHub Pages Reporting

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-e2e:
    name: Android Appium E2E Test Suite (510 Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'automation/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest Appium-Python-Client selenium Pillow

      - name: Stage 3: Execute Appium E2E Tests & Generate Reports
        run: |
          python automation/runners/run_tests.py

      - name: Stage 4: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-appium-e2e-results-build-${{ github.run_number }}
          path: |
            Test Results/
            reports/
          retention-days: 30

      - name: Stage 5: Publish Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
