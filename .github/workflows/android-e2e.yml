name: Android Appium E2E Automation

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-e2e:
    name: Execute Android Appium E2E Suite & Publish Reports
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stage 3 & 4: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest Appium-Python-Client selenium Pillow

      - name: Stage 5 - 17: Execute Appium E2E Automation Suite (510 Test Cases)
        run: |
          python automation/runners/run_tests.py

      - name: Stage 18: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-appium-e2e-results
          path: Test Results
          retention-days: 30

      - name: Stage 19 & 20: Prepare Reports History
        if: always()
        run: |
          mkdir -p reports/history/build-${{ github.run_number }}
          cp -r reports/latest/* reports/history/build-${{ github.run_number }}/ || true

      - name: Stage 21: Publish Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
