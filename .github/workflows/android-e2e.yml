name: Android Appium E2E Automation & GitHub Pages Reporting

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily midnight run

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  e2e-automation:
    name: Execute Android Appium E2E Suite & Publish Reports
    runs-on: macos-latest # macOS provides hardware acceleration (KVM/Hypervisor) for Android Emulator

    steps:
      # Stage 1: Checkout Repository
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2: Setup Java
      - name: Stage 2: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: Stage 3: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4: Install Android Dependencies & Setup Python
      - name: Stage 4: Install Dependencies (Python & Node)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Automation Packages
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest Appium-Python-Client selenium

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # Stage 5: Build APK
      - name: Stage 5: Build Debug Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Stage 6 & 7: Start Android Emulator & Verify Readiness
      - name: Stage 6 & 7: Start Android Emulator & Verify Readiness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Pixel_4
          script: |
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'
            echo "Emulator booted successfully!"
            adb devices

      # Stage 8: Install APK
      - name: Stage 8: Install APK on Emulator
        run: |
          adb install -r frontend/android/app/build/outputs/apk/debug/app-debug.apk

      # Stage 9 & 10: Start Appium Server & Verify Health
      - name: Stage 9 & 10: Start Appium Server & Verify Health
        run: |
          nohup appium --log-level info > appium.log 2>&1 &
          sleep 5
          curl --fail http://127.0.0.1:4723/status || echo "Appium status check bypassed"

      # Stage 11 - 17: Execute Appium E2E Tests & Generate Reports
      - name: Stage 11 - 17: Execute Appium E2E Tests & Generate Multi-Format Reports
        run: |
          python automation/runners/run_tests.py

      # Stage 18: Upload Build Artifacts
      - name: Stage 18: Upload Test Artifacts (Excel, HTML, JSON, Logs, Screenshots)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-test-results-build-${{ github.run_number }}
          path: |
            Test Results/
            reports/
          retention-days: 30

      # Stage 19 & 20: Publish Reports to GitHub Pages & Archive History
      - name: Stage 19 & 20: Prepare & Publish Reports to GitHub Pages
        if: always()
        run: |
          mkdir -p reports/history/build-${{ github.run_number }}
          cp -r reports/latest/* reports/history/build-${{ github.run_number }}/ || true

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true

      # Stage 21: Publish GitHub Action Summary
      - name: Stage 21: Render GitHub Action Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Android E2E Execution Summary Generated" >> $GITHUB_STEP_SUMMARY
          fi
