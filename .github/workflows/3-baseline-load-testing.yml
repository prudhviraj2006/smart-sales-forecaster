name: "3. Baseline Load & Performance Testing"

on:
  push:
    branches: [ main, hf-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  load-test:
    name: Execute 100 Virtual User Continuous Load Test (300+ Metrics)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Load Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl jinja2

      - name: Execute 100 VU Baseline Load Test
        run: |
          python automation/runners/run_load_test.py

      - name: Upload Performance Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-testing-results
          path: Test Results
          retention-days: 30
